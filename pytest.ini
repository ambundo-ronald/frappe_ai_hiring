"""
Pytest configuration for frappe_ai_hiring tests
"""

import os
import sys
import django
from pathlib import Path

# Add frappe to path
frappe_path = os.path.expanduser("~/.local/lib/python3.10/site-packages")
if frappe_path not in sys.path:
	sys.path.insert(0, frappe_path)

# Configure Django settings
os.environ.setdefault("DJANGO_SETTINGS_MODULE", "frappe.settings")

pytest_plugins = [
	"pytest_frappe.plugin",
]


def pytest_configure(config):
	"""Configure pytest"""
	# Initialize Frappe
	import frappe

	frappe.init_frappe_logger()
	if not frappe.db:
		frappe.connect()


def pytest_unconfigure(config):
	"""Clean up after tests"""
	import frappe

	if frappe.db:
		frappe.db.close()
