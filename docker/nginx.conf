upstream frappe-server {
    server erpnext:8000 fail_timeout=0;
}

upstream socketio-server {
    server erpnext:9000 fail_timeout=0;
}

server {
    listen 80;
    server_name localhost;

    client_max_body_size 50m;
    client_body_buffer_size 16k;
    client_header_buffer_size 1k;

    # App-specific assets (serve directly from app public folders)
    location /assets/frappe/ {
        alias /home/frappe/frappe-bench/apps/frappe/frappe/public/;
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public";
    }

    location /assets/erpnext/ {
        alias /home/frappe/frappe-bench/apps/erpnext/erpnext/public/;
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public";
    }

    location /assets/frappe_ai_hiring/ {
        alias /home/frappe/frappe-bench/apps/frappe_ai_hiring/public/;
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public";
    }

    # Static assets served directly by Nginx
    # Bench exposes compiled assets under sites/assets
    location /assets {
        alias /home/frappe/frappe-bench/sites/assets;
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public";
    }

    # Public files for the current site
    location /files {
        alias /home/frappe/frappe-bench/sites/localhost/public/files;
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public";
    }

    # Socket.io
    location /socket.io {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Frappe-Site-Name localhost;
        proxy_set_header Origin $scheme://$http_host;
        proxy_set_header Host $host;

        proxy_pass http://socketio-server;
    }

    # Main application
    location / {
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Frappe-Site-Name localhost;
        proxy_set_header Host $host;
        proxy_set_header X-Use-X-Accel-Redirect True;
        proxy_read_timeout 120;
        proxy_redirect off;

        proxy_pass http://frappe-server;
    }

    # Error pages
    error_page 502 /502.html;
    location /502.html {
        root /usr/share/nginx/html;
        internal;
    }
}
