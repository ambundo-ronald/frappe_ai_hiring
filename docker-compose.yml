version: "3.8"

services:
  # MariaDB Database
  mariadb:
    image: mariadb:10.6
    container_name: erpnext_mariadb
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_DATABASE: erpnext
      MYSQL_USER: erpnext
      MYSQL_PASSWORD: erpnext
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - erpnext_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-padmin"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis-cache:
    image: redis:7-alpine
    container_name: erpnext_redis_cache
    networks:
      - erpnext_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Queue
  redis-queue:
    image: redis:7-alpine
    container_name: erpnext_redis_queue
    networks:
      - erpnext_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ERPNext Backend
  erpnext:
    image: frappe/erpnext:v15.25.0
    container_name: erpnext_backend
    depends_on:
      mariadb:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
    environment:
      # Database Configuration
      DB_HOST: mariadb
      DB_PORT: 3306
      MYSQL_ROOT_PASSWORD: admin
      
      # Redis Configuration
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
      
      # Site Configuration
      SITE_NAME: localhost
      ADMIN_PASSWORD: admin
      INSTALL_APPS: erpnext
      
      # Development Mode
      DEVELOPER_MODE: 1
      
      # API Configuration (add your OpenAI key here)
      AI_HIRING_API_KEY: ${OPENAI_API_KEY:-sk-proj-your-api-key-here}
      
    volumes:
      # Mount AI Hiring app source code into apps directory
      - ./frappe_ai_hiring:/home/frappe/frappe-bench/apps/frappe_ai_hiring
      # Mount sites directory for persistence
      - sites_data:/home/frappe/frappe-bench/sites
      # Mount logs
      - logs_data:/home/frappe/frappe-bench/logs
    networks:
      - erpnext_network
    ports:
      - "8000:8000"
      - "9000:9000"
    stdin_open: true
    tty: true
    command: bash

  # Background Worker
  worker:
    image: frappe/erpnext:v15.25.0
    container_name: erpnext_worker
    depends_on:
      - erpnext
    environment:
      DB_HOST: mariadb
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
    volumes:
      - ./frappe_ai_hiring:/home/frappe/frappe-bench/apps/frappe_ai_hiring
      - sites_data:/home/frappe/frappe-bench/sites
      - logs_data:/home/frappe/frappe-bench/logs
    networks:
      - erpnext_network
    command: >
      bash -c "
        echo 'Worker waiting for site initialization...'
        sleep 60
        echo 'Starting worker...'
        bench worker --queue default,short,long
      "

  # Background Scheduler
  scheduler:
    image: frappe/erpnext:v15.25.0
    container_name: erpnext_scheduler
    depends_on:
      - erpnext
    environment:
      DB_HOST: mariadb
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
    volumes:
      - ./frappe_ai_hiring:/home/frappe/frappe-bench/apps/frappe_ai_hiring
      - sites_data:/home/frappe/frappe-bench/sites
      - logs_data:/home/frappe/frappe-bench/logs
    networks:
      - erpnext_network
    command: >
      bash -c "
        echo 'Scheduler waiting for site initialization...'
        sleep 60
        echo 'Starting scheduler...'
        bench schedule
      "


volumes:
  mariadb_data:
    driver: local
  sites_data:
    driver: local
  logs_data:
    driver: local

networks:
  erpnext_network:
    driver: bridge
